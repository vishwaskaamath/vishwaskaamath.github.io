# Builds the static site (next build → out/) and publishes it to GitHub Pages
# on every push to main. One-time setup in the repo: Settings → Pages →
# Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build

      # Pages must not run Jekyll over the export (it hides _next/).
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Safeguard: if Settings → Pages is ever left on "Deploy from a branch",
      # GitHub also runs its own Jekyll build ("pages build and deployment")
      # on every push and publishes the README over the site. Wait for that
      # run to finish so this deployment always lands last.
      - name: Wait for GitHub's branch build, if any
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          sleep 20
          for i in $(seq 1 30); do
            busy=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
              | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$busy" = "0" ]; then break; fi
            echo "Waiting for pages build and deployment ($busy running)"
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
